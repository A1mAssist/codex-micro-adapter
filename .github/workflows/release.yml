name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows-installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify release version
        shell: pwsh
        run: |
          $config = Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($config.version)") {
            throw "Tag $env:GITHUB_REF_NAME does not match tauri version $($config.version)"
          }
      - name: Run release checks
        shell: pwsh
        run: |
          cargo test -p codex-micro-backend
          node --check desktop/ui/app.js
          node scripts/check-harness-adapters.mjs
      - name: Build MSI and NSIS installers
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2 build
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
